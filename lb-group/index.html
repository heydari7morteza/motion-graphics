<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Leo Blue Group - Full Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #stage {
            position: relative;
            width: 1080px;
            height: 1920px;
            transform-origin: center center;
            transform: scale(0.35);
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 180, 216, 0.25);
            will-change: transform;
            flex-shrink: 0;
        }
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a1128 0%, #000000 100%);
            overflow: hidden;
            backface-visibility: hidden;
        }

        /* ==================== SLIDE 1 ==================== */
        #slide-1 .house-wrapper {
            position: absolute;
            top: 0;
            left: -7%;
            width: 114%;
            height: auto;
            z-index: 1;
        }
        #slide-1 .left-house {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            -webkit-mask-image:
                linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, black 8%, black 42%, transparent 88%);
            mask-image:
                linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, black 8%, black 42%, transparent 88%);
            -webkit-mask-composite: source-in;
            mask-composite: intersect;
        }
        #slide-1 .content-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 200px;
            z-index: 3;
        }
        #slide-1 .logo {
            width: 550px;
            height: auto;
            margin-bottom: 40px;
            opacity: 0;
            filter: drop-shadow(0 0 30px rgba(0, 180, 216, 0.6));
        }
        #slide-1 .text-container {
            display: flex;
            gap: 15px;
            font-size: 65px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        #slide-1 .text-leo { color: #ffffff; opacity: 0; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
        #slide-1 .text-blue { color: #00b4d8; opacity: 0; text-shadow: 0 0 25px rgba(0, 180, 216, 0.8); }
        #slide-1 .text-group { color: #ffffff; opacity: 0; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
        #slide-1 .neon-line {
            margin-top: 25px;
            height: 6px;
            width: 65%;
            border-radius: 6px;
            background: linear-gradient(90deg, rgba(0,229,255,0) 0%, #00e5ff 30%, #ffffff 50%, #00e5ff 70%, rgba(0,229,255,0) 100%);
            opacity: 0;
            transform: scaleX(0);
            transform-origin: center;
        }

        /* ==================== SLIDE 2 ==================== */
        #slide-2 .text-container-s2 {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #slide-2 .s2-text-1, #slide-2 .s2-text-2, #slide-2 .s2-text-3 {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: baseline;
            white-space: nowrap;
        }
        #slide-2 .s2-text-1 { font-size: 65px; font-weight: 900; color: #ffffff; letter-spacing: 4px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        #slide-2 .s2-text-2 { font-size: 50px; font-weight: 700; color: #00b4d8; letter-spacing: 2px; margin-top: 10px; text-shadow: 0 0 25px rgba(0, 180, 216, 0.6); }
        #slide-2 .s2-text-3 { font-size: 60px; font-weight: 900; color: #ffffff; letter-spacing: 2px; margin-top: 15px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
        #slide-2 .s2-text-2 .emph { font-size: 72px; font-weight: 900; letter-spacing: 4px; }
        #slide-2 .s2-text-3 .emph { font-size: 78px; font-weight: 900; letter-spacing: 4px; }
        #slide-2 .s2-neon-line {
            margin-top: 20px;
            height: 4px;
            width: 50%;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(0,229,255,0) 0%, #00e5ff 30%, #ffffff 50%, #00e5ff 70%, rgba(0,229,255,0) 100%);
            box-shadow: 0 0 15px #00e5ff, 0 0 30px #00b4d8;
            opacity: 0;
        }
        #slide-2 .stack-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            z-index: 10;
        }
        #slide-2 .stack-container {
            position: relative;
            width: 1000px;
            height: 900px;
            perspective: 1200px;
        }
        #slide-2 .stacked-card {
            position: absolute;
            top: 50%; left: 50%;
            width: 720px;
            height: 840px;
            margin: -420px 0 0 -360px;
            background: #0d1529;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 180, 216, 0.1);
            overflow: hidden;
            opacity: 0;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
        }
        #slide-2 .card-img-container {
            width: 100%;
            height: 76%;
            position: relative;
            overflow: hidden;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
        }
        #slide-2 .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #slide-2 .card-content {
            height: 24%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background: #0d1528;
            position: relative;
            z-index: 2;
            padding: 0 40px;
        }
        #slide-2 .card-icon-wrap {
            width: 110px;
            height: 110px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border: none;
            box-shadow: none;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.8)) drop-shadow(0 0 35px rgba(0, 180, 216, 0.5));
        }
        #slide-2 .card-icon-wrap img { width: 100px; height: 100px; }
        #slide-2 .card-title-wrap {
            width: 450px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }
        #slide-2 .card-title {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: left;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
            display: flex;
            align-items: center;
            direction: ltr;
        }
        #slide-2 .card-title span { display: inline-block; }

        /* ==================== SLIDE 3 ==================== */
        #slide-3 .flash-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.35) 0%, rgba(0,229,255,0.12) 30%, transparent 65%);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
        }
        #slide-3 .stamp-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            text-align: center;
            transform-origin: center center;
        }
        #slide-3 .stamp-text {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            position: relative;
        }
        #slide-3 .stamp-text .line {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.35), 0 0 30px rgba(0, 180, 216, 0.25);
            display: flex;
            gap: 2px;
            justify-content: center;
        }
        #slide-3 .stamp-text .line span { display: inline-block; }
        #slide-3 .stamp-text .line.highlight {
            color: #00e5ff;
            text-shadow: 0 0 18px rgba(0, 229, 255, 0.7), 0 0 38px rgba(0, 180, 216, 0.4);
        }
        #slide-3 .indicator-dot {
            position: absolute;
            left: -70px;
            top: 27px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 15px #00e5ff, 0 0 35px #00e5ff, 0 0 70px #00e5ff, 0 0 110px rgba(0,229,255,0.7);
            opacity: 0;
        }
        #slide-3 .stamp-border {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 860px;
            height: 420px;
            border-radius: 24px;
            pointer-events: none;
            opacity: 0;
            box-shadow:
                0 0 4px rgba(0, 229, 255, 0.55),
                0 0 12px rgba(0, 229, 255, 0.4),
                0 0 26px rgba(0, 229, 255, 0.28),
                0 0 55px rgba(0, 180, 216, 0.15),
                inset 0 0 6px rgba(0, 229, 255, 0.35),
                inset 0 0 18px rgba(0, 180, 216, 0.15),
                inset 0 0 38px rgba(0, 180, 216, 0.06);
        }
        #slide-3 .impact-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 3px solid rgba(0, 229, 255, 0.7);
            pointer-events: none;
            opacity: 0;
        }
        #slide-3 .features-wrapper {
            position: absolute;
            top: 60%; left: 50%;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 50px;
            z-index: 10;
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        #slide-3 .feature-item {
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 0 90px;
            opacity: 0;
            justify-content: flex-start;
        }
        #slide-3 .feature-icon {
            width: 80px; height: 80px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            order: 1;
            filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.9)) drop-shadow(0 0 28px rgba(0, 180, 216, 0.5));
        }
        #slide-3 .feature-icon svg { width: 80px; height: 80px; }
        #slide-3 .feature-text {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
            white-space: nowrap;
            display: flex;
            flex-wrap: nowrap;
            order: 2;
        }
        #slide-3 .feature-text span { display: inline-block; }
        #slide-3 .feature-text .highlight {
            color: #00e5ff;
            font-weight: 900;
            text-shadow: 0 0 22px rgba(0, 229, 255, 0.9);
        }
        #slide-3 .cta-wrapper {
            position: absolute;
            top: 64%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 42px;
            opacity: 0;
        }
        #slide-3 .cta-title {
            font-size: 62px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 8px;
            text-align: center;
            text-shadow: 0 0 22px rgba(0, 229, 255, 0.55), 0 0 48px rgba(0, 180, 216, 0.28);
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        #slide-3 .cta-title span { display: inline-block; }
        #slide-3 .cta-title .accent {
            color: #00e5ff;
            text-shadow: 0 0 26px rgba(0, 229, 255, 0.9), 0 0 52px rgba(0, 180, 216, 0.5);
        }
        #slide-3 .cta-item {
            display: flex;
            align-items: center;
            gap: 32px;
            width: 920px;
            padding: 30px 50px;
            border-radius: 22px;
            background: linear-gradient(90deg, rgba(0, 180, 216, 0.08) 0%, rgba(0, 229, 255, 0.03) 100%);
            border: 1px solid rgba(0, 229, 255, 0.32);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.15), inset 0 0 20px rgba(0, 229, 255, 0.04);
            position: relative;
            overflow: hidden;
            min-height: 135px;
        }
        #slide-3 .cta-item .icon-wrap {
            width: 100px; height: 100px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 14px rgba(0, 229, 255, 0.85)) drop-shadow(0 0 30px rgba(0, 180, 216, 0.45));
            position: relative;
            z-index: 2;
            transform-origin: center center;
        }
        #slide-3 .cta-item .icon-wrap svg { width: 90px; height: 90px; }
        #slide-3 .cta-item .text-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        #slide-3 .cta-item .text {
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.15;
            white-space: normal;
            display: flex;
            flex-wrap: wrap;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }
        #slide-3 .cta-item .text span { display: inline-block; }
        #slide-3 .phone-item .text {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 6px;
        }
        #slide-3 .phone-item .fill-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 0%; height: 100%;
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.18) 0%, rgba(0, 180, 216, 0.08) 100%);
            pointer-events: none;
            z-index: 1;
            border-radius: 22px;
        }
        #slide-3 .phone-item.filled .text {
            color: #ffffff;
            text-shadow: 0 0 16px rgba(0, 229, 255, 0.8), 0 0 32px rgba(0, 180, 216, 0.5);
        }
        #slide-3 .phone-item.filled .icon-wrap {
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.9)) drop-shadow(0 0 42px rgba(0, 180, 216, 0.6));
        }

        /* ==================== FINAL SLIDE ==================== */
        #final-slide .final-content {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 5;
        }
        #final-slide .final-heading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #final-slide .final-heading .line {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.4), 0 0 42px rgba(0, 180, 216, 0.3);
            display: flex;
            gap: 2px;
            justify-content: center;
            white-space: nowrap;
        }
        #final-slide .final-heading .line span { display: inline-block; }
        #final-slide .final-heading .line.accent {
            color: #00e5ff;
            text-shadow: 0 0 24px rgba(0, 229, 255, 0.85), 0 0 52px rgba(0, 180, 216, 0.55);
            font-size: 82px;
            font-weight: 900;
            letter-spacing: 3px;
        }
        #final-slide .final-neon-line {
            margin-top: 20px;
            height: 5px;
            width: 55%;
            border-radius: 5px;
            background: linear-gradient(90deg, rgba(0,229,255,0) 0%, #00e5ff 30%, #ffffff 50%, #00e5ff 70%, rgba(0,229,255,0) 100%);
            box-shadow: 0 0 15px #00e5ff, 0 0 30px #00b4d8;
            opacity: 0;
        }
        #final-slide .final-cta {
            margin-top: 60px;
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 30px 70px;
            border-radius: 60px;
            background: linear-gradient(90deg, rgba(0, 180, 216, 0.15) 0%, rgba(0, 229, 255, 0.06) 100%);
            border: 2px solid rgba(0, 229, 255, 0.55);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.35), inset 0 0 22px rgba(0, 229, 255, 0.08);
            opacity: 0;
        }
        #final-slide .final-cta .dm-icon {
            width: 55px;
            height: 55px;
            filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.9)) drop-shadow(0 0 26px rgba(0, 180, 216, 0.5));
        }
        #final-slide .final-cta .dm-text {
            font-size: 46px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 5px;
            text-shadow: 0 0 18px rgba(0, 229, 255, 0.7), 0 0 38px rgba(0, 180, 216, 0.4);
            display: flex;
            gap: 2px;
        }
        #final-slide .final-cta .dm-text span { display: inline-block; }
        #final-slide .final-cta .dm-text .accent {
            color: #00e5ff;
            text-shadow: 0 0 24px rgba(0, 229, 255, 1), 0 0 52px rgba(0, 180, 216, 0.6);
        }
        #final-slide .final-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.12) 0%, rgba(0, 180, 216, 0.05) 30%, transparent 65%);
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="slide-1" class="slide">
            <div class="house-wrapper">
                <img src="home-left.png" alt="Home" class="left-house">
            </div>
            <div class="content-wrapper">
                <img src="logo.png" alt="Leo Blue Logo" class="logo">
                <div class="text-container">
                    <span class="text-leo">LEO</span>
                    <span class="text-blue">BLUE</span>
                    <span class="text-group">GROUP</span>
                </div>
                <div class="neon-line"></div>
            </div>
        </div>

        <div id="slide-2" class="slide">
            <div class="text-container-s2">
                <div class="s2-text-1"><span>ONE</span> <span>GROUP.</span></div>
                <div class="s2-text-2"><span class="emph">EIGHT</span> <span>DIVISIONS.</span></div>
                <div class="s2-text-3"><span>OVER</span> <span class="emph">100</span> <span>SERVICES.</span></div>
                <div class="s2-neon-line"></div>
            </div>
            <div class="stack-wrapper">
                <div class="stack-container">
                    <div class="stacked-card" data-index="0" data-title="CLEANING">
                        <div class="card-img-container"><img src="item1.png" class="card-img" alt="Cleaning"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon1.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                    <div class="stacked-card" data-index="1" data-title="VALETING">
                        <div class="card-img-container"><img src="item2.png" class="card-img" alt="Valeting"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon2.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                    <div class="stacked-card" data-index="2" data-title="HANDYMAN">
                        <div class="card-img-container"><img src="item3.png" class="card-img" alt="Handyman"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon3.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                    <div class="stacked-card" data-index="3" data-title="WASTE">
                        <div class="card-img-container"><img src="item4.png" class="card-img" alt="Waste"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon4.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                    <div class="stacked-card" data-index="4" data-title="REMOVALS">
                        <div class="card-img-container"><img src="item5.png" class="card-img" alt="Removals"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon5.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                    <div class="stacked-card" data-index="5" data-title="EXTERIOR">
                        <div class="card-img-container"><img src="item6.png" class="card-img" alt="Exterior"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon6.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                    <div class="stacked-card" data-index="6" data-title="LOCKSMITH">
                        <div class="card-img-container"><img src="item7.png" class="card-img" alt="Locksmith"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon7.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                    <div class="stacked-card" data-index="7" data-title="LANDSCAPING">
                        <div class="card-img-container"><img src="item8.png" class="card-img" alt="Landscaping"></div>
                        <div class="card-content">
                            <div class="card-icon-wrap"><img src="icon8.png" alt="Icon"></div>
                            <div class="card-title-wrap"><div class="card-title"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="slide-3" class="slide">
            <div class="flash-overlay"></div>
            <div class="stamp-container">
                <div class="stamp-border"></div>
                <div class="stamp-text">
                    <div class="line" data-text="RELIABLE."></div>
                    <div class="line highlight" data-text="PROFESSIONAL."></div>
                    <div class="line" data-text="TRUSTED."></div>
                    <div class="indicator-dot"></div>
                </div>
            </div>
            <div class="features-wrapper">
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 100 100" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="50" cy="50" r="42"/><path d="M30 50 L45 65 L72 38"/>
                        </svg>
                    </div>
                    <div class="feature-text" data-text="HIGH QUALITY|STANDARDS"></div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 100 100" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="50" cy="50" r="42"/><path d="M30 50 L45 65 L72 38"/>
                        </svg>
                    </div>
                    <div class="feature-text" data-text="EXPERIENCED|TEAM"></div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 100 100" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="50" cy="50" r="42"/><path d="M30 50 L45 65 L72 38"/>
                        </svg>
                    </div>
                    <div class="feature-text" data-text="FULLY|INSURED"></div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <svg viewBox="0 0 100 100" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="50" cy="50" r="42"/><path d="M30 50 L45 65 L72 38"/>
                        </svg>
                    </div>
                    <div class="feature-text" data-text="RESIDENTIAL|&amp; COMMERCIAL"></div>
                </div>
            </div>
            <div class="cta-wrapper">
                <div class="cta-title"><span>GET</span><span>IN</span><span class="accent">TOUCH</span></div>
                <div class="cta-item website-item">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        </svg>
                    </div>
                    <div class="text-wrap"><div class="text" data-text="www.leobluegroup.co.uk"></div></div>
                </div>
                <div class="cta-item location-item">
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                        </svg>
                    </div>
                    <div class="text-wrap"><div class="text" data-text="Essex, London &amp; Surrounding Areas"></div></div>
                </div>
                <div class="cta-item phone-item">
                    <div class="fill-overlay"></div>
                    <div class="icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                    </div>
                    <div class="text-wrap"><div class="text" data-text="07440 776511"></div></div>
                </div>
            </div>
        </div>

        <div id="final-slide" class="slide">
            <div class="final-glow"></div>
            <div class="final-content">
                <div class="final-heading">
                    <div class="line" data-text="Want To Present"></div>
                    <div class="line" data-text="Your Business"></div>
                    <div class="line accent" data-text="Like This?"></div>
                </div>
                <div class="final-neon-line"></div>
                <div class="final-cta">
                    <svg class="dm-icon" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <div class="dm-text">
                        <span>DM</span><span>&nbsp;</span><span>FOR</span><span>&nbsp;</span><span>YOUR</span><span>&nbsp;</span><span class="accent">VIDEO</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
           DYNAMIC STAGE SCALING
           مقیاس خودکار بر اساس اندازه صفحه — روی گوشی، لپ‌تاپ و دسکتاپ
           ============================================================ */
        function fitStage() {
            const stage = document.getElementById('stage');
            if (!stage) return;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const scale = Math.min(vw / 1080, vh / 1920);
            stage.style.transform = 'scale(' + scale + ')';
            stage.style.transformOrigin = 'center center';
        }
        window.addEventListener('resize', fitStage);
        window.addEventListener('orientationchange', fitStage);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fitStage);
        }
        fitStage();

        /* ============================================================
           BASE_URL — آدرس پایه‌ی همه‌ی تصاویر
           ============================================================ */
        const BASE_URL = "./";

        document.querySelectorAll('img[src]').forEach(function (img) {
            const original = img.getAttribute('src');
            if (!original.startsWith('http') && !original.startsWith('data:')) {
                img.setAttribute('src', BASE_URL + original);
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            fitStage();

            function buildCharsFromText(container, text, highlightFirst = false) {
                container.innerHTML = '';
                const parts = text.split('|');
                let isFirst = true;
                parts.forEach(part => {
                    part.split('').forEach(ch => {
                        const s = document.createElement('span');
                        s.textContent = ch;
                        if (highlightFirst && isFirst) s.className = 'highlight';
                        container.appendChild(s);
                    });
                    if (parts.length > 1 && isFirst) {
                        const sp = document.createElement('span');
                        sp.innerHTML = '&nbsp;';
                        container.appendChild(sp);
                    }
                    isFirst = false;
                });
            }

            function buildStampChars() {
                document.querySelectorAll('#slide-3 .stamp-text .line').forEach(line => {
                    const text = line.getAttribute('data-text');
                    line.innerHTML = '';
                    text.split('').forEach(ch => {
                        const s = document.createElement('span');
                        s.textContent = ch;
                        line.appendChild(s);
                    });
                });
            }

            function buildFinalHeading() {
                document.querySelectorAll('#final-slide .final-heading .line').forEach(line => {
                    const text = line.getAttribute('data-text');
                    line.innerHTML = '';
                    text.split('').forEach(ch => {
                        const s = document.createElement('span');
                        if (ch === ' ') s.innerHTML = '&nbsp;';
                        else s.textContent = ch;
                        line.appendChild(s);
                    });
                });
            }

            buildStampChars();
            buildFinalHeading();

            const featureTexts = document.querySelectorAll('#slide-3 .feature-text');
            featureTexts.forEach(el => {
                buildCharsFromText(el, el.getAttribute('data-text'), true);
            });

            const ctaTexts = document.querySelectorAll('#slide-3 .cta-item .text');
            ctaTexts.forEach(el => {
                const text = el.getAttribute('data-text');
                el.innerHTML = '';
                const words = text.split(' ');
                words.forEach((word, wIdx) => {
                    word.split('').forEach(ch => {
                        const s = document.createElement('span');
                        s.textContent = ch;
                        el.appendChild(s);
                    });
                    if (wIdx < words.length - 1) {
                        const sp = document.createElement('span');
                        sp.innerHTML = '&nbsp;';
                        sp.style.width = '0.3em';
                        el.appendChild(sp);
                    }
                });
            });

            const cards = gsap.utils.toArray('#slide-2 .stacked-card');
            const stampChars = gsap.utils.toArray('#slide-3 .stamp-text .line span');
            const featureItems = gsap.utils.toArray('#slide-3 .feature-item');
            const ctaItems = gsap.utils.toArray('#slide-3 .cta-item');
            const finalLines = gsap.utils.toArray('#final-slide .final-heading .line span');

            let currentIndex = 0;
            let slidesShown = 1;
            let carouselInterval;
            let iconAnimated = new Set();

            const positions = [
                { x: 0,   y: 0,  rotation: -3, scale: 1,    opacity: 1,    zIndex: 100 },
                { x: 50,  y: 12, rotation: 3,  scale: 0.95, opacity: 1,    zIndex: 90  },
                { x: 90,  y: 24, rotation: 7,  scale: 0.9,  opacity: 1,    zIndex: 80  },
                { x: 125, y: 36, rotation: 11, scale: 0.85, opacity: 0.8,  zIndex: 70  },
                { x: 155, y: 48, rotation: 15, scale: 0.8,  opacity: 0.5,  zIndex: 60  },
                { x: 180, y: 60, rotation: 19, scale: 0.75, opacity: 0.25, zIndex: 50  },
                { x: 200, y: 72, rotation: 23, scale: 0.7,  opacity: 0.1,  zIndex: 40  },
                { x: 215, y: 84, rotation: 26, scale: 0.65, opacity: 0,    zIndex: 30  }
            ];

            gsap.set("#slide-2", { y: "100%" });
            gsap.set("#slide-3", { y: "100%" });
            gsap.set("#final-slide", { y: "100%" });

            gsap.set(cards, { x: 0, y: 0, rotation: 0, scale: 0.5, opacity: 0, zIndex: 0 });
            cards.forEach(card => {
                gsap.set(card.querySelector('.card-icon-wrap'), { x: 240 });
            });
            gsap.set("#slide-2 .text-container-s2", { xPercent: -50, yPercent: -50, y: 0 });
            gsap.set("#slide-2 .stack-wrapper", { xPercent: -50, yPercent: -50, y: 1600, opacity: 0 });

            gsap.set("#slide-3 .stamp-container", { xPercent: -50, yPercent: -50, scale: 2.4, y: -900, opacity: 0, rotation: -6 });
            gsap.set(stampChars, { opacity: 0 });
            gsap.set("#slide-3 .indicator-dot", { opacity: 0, scale: 0, y: 0 });
            gsap.set("#slide-3 .stamp-border", { opacity: 0, scale: 0.9 });
            gsap.set("#slide-3 .impact-ring", { opacity: 0, width: 200, height: 200, borderWidth: 5 });
            gsap.set("#slide-3 .flash-overlay", { opacity: 0 });
            gsap.set("#slide-3 .features-wrapper", { xPercent: -50, yPercent: -50, opacity: 0 });
            gsap.set(featureItems, { opacity: 0 });
            featureTexts.forEach(el => gsap.set(el.children, { opacity: 0, x: 30 }));
            gsap.set("#slide-3 .cta-wrapper", { xPercent: -50, yPercent: -50, opacity: 0 });
            gsap.set("#slide-3 .cta-title span", { opacity: 0, y: 40 });
            gsap.set(ctaItems, { opacity: 0, y: 60 });
            ctaItems.forEach(item => {
                const icon = item.querySelector('.icon-wrap');
                const txt = item.querySelector('.text');
                gsap.set(icon, { x: 220 });
                gsap.set(txt.children, { opacity: 0, x: 30 });
            });

            gsap.set("#final-slide .final-content", { xPercent: -50, yPercent: -50 });
            gsap.set(finalLines, { opacity: 0, x: 60, filter: "blur(8px)" });
            gsap.set("#final-slide .final-neon-line", { opacity: 0, scaleX: 0, transformOrigin: "center center" });
            gsap.set("#final-slide .final-cta", { opacity: 0, y: 40, scale: 0.9 });
            gsap.set("#final-slide .final-cta .dm-text span", { opacity: 0, x: 20 });
            gsap.set("#final-slide .final-cta .dm-icon", { opacity: 0, x: -20 });
            gsap.set("#final-slide .final-glow", { opacity: 0, scale: 0.6 });

            function updateStack() {
                cards.forEach((card, index) => {
                    let stackPos = index - currentIndex;
                    if (stackPos < 0) stackPos += cards.length;
                    const pos = stackPos >= positions.length ? positions[positions.length - 1] : positions[stackPos];
                    gsap.to(card, {
                        x: pos.x, y: pos.y, rotation: pos.rotation, scale: pos.scale,
                        opacity: pos.opacity, zIndex: pos.zIndex,
                        duration: 0.9, ease: "power2.out"
                    });
                });
            }

            function animateCardContent(card) {
                const icon = card.querySelector('.card-icon-wrap');
                const titleEl = card.querySelector('.card-title');
                const text = card.getAttribute('data-title');
                const cardIdx = card.getAttribute('data-index');

                if (!iconAnimated.has(cardIdx)) {
                    gsap.to(icon, { x: 0, duration: 0.9, ease: "power2.inOut" });
                    iconAnimated.add(cardIdx);
                }

                titleEl.innerHTML = '';
                text.split('').forEach(char => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    titleEl.appendChild(span);
                });

                gsap.fromTo(titleEl.children,
                    { x: 40, opacity: 0 },
                    { x: 0, opacity: 1, duration: 0.6, stagger: 0.06, ease: "power2.out", delay: 0.3 }
                );
            }

            function nextCard() {
                if (slidesShown >= 8) {
                    clearInterval(carouselInterval);
                    return;
                }
                const frontCard = cards[currentIndex];
                gsap.to(frontCard, {
                    x: -900,
                    opacity: 0,
                    duration: 0.65,
                    ease: "power2.in",
                    onComplete: () => {
                        currentIndex = currentIndex + 1;
                        slidesShown++;
                        updateStack();
                        animateCardContent(cards[currentIndex]);
                    }
                });
            }

            function startSlide2Carousel() {
                animateCardContent(cards[0]);
                updateStack();
                carouselInterval = setInterval(nextCard, 2200);
            }

            const masterTl = gsap.timeline({ delay: 0.2 });

            /* ===== SLIDE 1 ===== */
            masterTl
                .fromTo("#slide-1 .left-house",
                    { opacity: 0, scale: 1.05 },
                    { opacity: 0.55, scale: 1, duration: 1.5, ease: "power3.out" }, 0)
                .fromTo("#slide-1 .logo",
                    { opacity: 0, scale: 0.7, y: 30 },
                    { opacity: 1, scale: 1, y: 0, duration: 1.1, ease: "back.out(1.5)" }, 0.7)
                .fromTo("#slide-1 .text-leo",
                    { opacity: 0, x: 100 },
                    { opacity: 1, x: 0, duration: 0.8, ease: "power4.out" }, 1.8)
                .fromTo("#slide-1 .text-blue",
                    { opacity: 0, x: 50 },
                    { opacity: 1, x: 0, duration: 0.8, ease: "power4.out" }, 2.0)
                .fromTo("#slide-1 .text-group",
                    { opacity: 0, x: -100 },
                    { opacity: 1, x: 0, duration: 0.8, ease: "power4.out" }, 2.2)
                .to("#slide-1 .neon-line",
                    { scaleX: 1, opacity: 1, duration: 1.1, ease: "power4.inOut" }, 2.9)
                .to("#slide-1 .neon-line",
                    {
                        boxShadow: "0 0 15px rgba(255,255,255,0.9), 0 0 30px rgba(0,229,255,0.8), 0 0 60px rgba(0,180,216,0.6)",
                        duration: 1.1, repeat: 1, yoyo: true, ease: "sine.inOut"
                    }, 4.0);

            /* ===== TRANSITION 1 → 2 ===== */
            masterTl
                .to("#slide-1", { y: "-100%", duration: 0.9, ease: "power2.inOut" }, 5.6)
                .to("#slide-2", { y: "0%", duration: 0.9, ease: "power2.inOut" }, "<");

            /* ===== SLIDE 2 ===== */
            masterTl
                .fromTo("#slide-2 .s2-text-1 span",
                    { x: 80, opacity: 0, filter: "blur(8px)" },
                    { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, stagger: 0.09, ease: "power3.out" })
                .fromTo("#slide-2 .s2-text-2 span",
                    { x: 80, opacity: 0, filter: "blur(8px)" },
                    { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, stagger: 0.09, ease: "power3.out" }, "-=0.6")
                .fromTo("#slide-2 .s2-text-3 span",
                    { x: 80, opacity: 0, filter: "blur(8px)" },
                    { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, stagger: 0.09, ease: "power3.out" }, "-=0.6")
                .to("#slide-2 .s2-neon-line",
                    { opacity: 1, duration: 0.9, ease: "power2.out" }, "-=0.5")
                .to("#slide-2 .text-container-s2",
                    { y: -600, duration: 1.0, ease: "power2.inOut" }, "+=0.05")
                .to("#slide-2 .stack-wrapper",
                    { y: 240, opacity: 1, duration: 1.2, ease: "power2.out" }, "<")
                .add(() => startSlide2Carousel(), "-=0.4");

            masterTl.to({}, { duration: 19 });

            /* ===== TRANSITION 2 → 3 ===== */
            masterTl
                .add(() => { if (carouselInterval) clearInterval(carouselInterval); })
                .to("#slide-2", { y: "-100%", duration: 0.9, ease: "power2.inOut" })
                .to("#slide-3", { y: "0%", duration: 0.9, ease: "power2.inOut" }, "<");

            /* ===== SLIDE 3 ===== */
            masterTl
                .to("#slide-3 .stamp-container", { opacity: 1, duration: 0.15 })
                .to("#slide-3 .stamp-container", {
                    y: 0, scale: 1, rotation: 0,
                    duration: 0.5, ease: "power1.in"
                })
                .to(stampChars, {
                    opacity: 1, duration: 0.08,
                    stagger: 0.007, ease: "power1.out"
                }, "-=0.18")
                .to("#slide-3 .stamp-container", {
                    scale: 1.02, y: 4, duration: 0.13, ease: "power1.out"
                })
                .to("#slide-3 .flash-overlay", { opacity: 0.3, duration: 0.07 }, "-=0.07")
                .to("#slide-3 .flash-overlay", { opacity: 0.1, duration: 0.08 })
                .to("#slide-3 .flash-overlay", { opacity: 0.22, duration: 0.07 })
                .to("#slide-3 .flash-overlay", { opacity: 0, duration: 0.4, ease: "power2.in" })
                .to("#slide-3 .stamp-border", {
                    opacity: 1, scale: 1, duration: 0.28, ease: "power2.out"
                }, "-=0.55")
                .to("#slide-3 .impact-ring", {
                    opacity: 0.7, width: 1150, height: 1150,
                    borderWidth: 0.5, duration: 0.8, ease: "power2.out"
                }, "-=0.65")
                .to("#slide-3 .impact-ring", { opacity: 0, duration: 0.25 }, "-=0.15")
                .to("#slide-3 .stamp-container", {
                    scale: 1, y: 0, duration: 0.55, ease: "power2.out"
                }, "-=0.7")
                .to("#slide-3 .stamp-container", { rotation: 1.2, duration: 0.18, ease: "power1.out" }, "-=0.45")
                .to("#slide-3 .stamp-container", { rotation: -0.5, duration: 0.22, ease: "power1.inOut" })
                .to("#slide-3 .stamp-container", { rotation: 0.15, duration: 0.25, ease: "power1.inOut" })
                .to("#slide-3 .stamp-container", { rotation: 0, duration: 0.3, ease: "power1.out" })
                .to("#slide-3 .indicator-dot", {
                    opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)"
                }, "+=0.3")
                .to("#slide-3 .indicator-dot", { y: 90, duration: 0.9, ease: "power2.inOut" }, "+=0.5")
                .to("#slide-3 .indicator-dot", { y: 180, duration: 0.9, ease: "power2.inOut" }, "+=0.5")
                .to("#slide-3 .indicator-dot", {
                    opacity: 0, scale: 0.5, duration: 0.35, ease: "power2.in"
                }, "+=0.5")
                .to("#slide-3 .stamp-container", {
                    y: -400, duration: 1.1, ease: "power2.inOut"
                }, "+=0.2")
                .to("#slide-3 .features-wrapper", {
                    opacity: 1, duration: 0.35, ease: "power2.out"
                }, "<")
                .to(featureItems[0], { opacity: 1, duration: 0.01 })
                .fromTo(featureItems[0], { x: 300 }, { x: 0, duration: 0.65, ease: "power2.out" }, "<")
                .to(featureTexts[0].children, { opacity: 1, x: 0, duration: 0.4, stagger: 0.03, ease: "power2.out", delay: 0.3 }, "<")
                .to(featureItems[1], { opacity: 1, duration: 0.01 }, "+=0.4")
                .fromTo(featureItems[1], { x: 300 }, { x: 0, duration: 0.65, ease: "power2.out" }, "<")
                .to(featureTexts[1].children, { opacity: 1, x: 0, duration: 0.4, stagger: 0.03, ease: "power2.out", delay: 0.3 }, "<")
                .to(featureItems[2], { opacity: 1, duration: 0.01 }, "+=0.4")
                .fromTo(featureItems[2], { x: 300 }, { x: 0, duration: 0.65, ease: "power2.out" }, "<")
                .to(featureTexts[2].children, { opacity: 1, x: 0, duration: 0.4, stagger: 0.03, ease: "power2.out", delay: 0.3 }, "<")
                .to(featureItems[3], { opacity: 1, duration: 0.01 }, "+=0.4")
                .fromTo(featureItems[3], { x: 300 }, { x: 0, duration: 0.65, ease: "power2.out" }, "<")
                .to(featureTexts[3].children, { opacity: 1, x: 0, duration: 0.4, stagger: 0.03, ease: "power2.out", delay: 0.3 }, "<")
                .to(featureItems, {
                    x: -1400, opacity: 0, duration: 0.8,
                    stagger: 0.08, ease: "power2.in"
                }, "+=0.6")
                .to("#slide-3 .cta-wrapper", {
                    opacity: 1, duration: 0.25
                }, "-=0.35")
                .to("#slide-3 .cta-title span", {
                    opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: "power2.out"
                })
                .to(ctaItems[0], { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, "+=0.25")
                .add(() => {
                    const icon = ctaItems[0].querySelector('.icon-wrap');
                    const txt = ctaItems[0].querySelector('.text');
                    gsap.to(icon, { x: 0, duration: 1.0, ease: "power2.inOut" });
                    gsap.to(txt.children, { opacity: 1, x: 0, duration: 0.45, stagger: 0.025, ease: "power2.out", delay: 0.35 });
                })
                .to(ctaItems[1], { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, "+=0.3")
                .add(() => {
                    const icon = ctaItems[1].querySelector('.icon-wrap');
                    const txt = ctaItems[1].querySelector('.text');
                    gsap.to(icon, { x: 0, duration: 1.0, ease: "power2.inOut" });
                    gsap.to(txt.children, { opacity: 1, x: 0, duration: 0.45, stagger: 0.025, ease: "power2.out", delay: 0.35 });
                })
                .to(ctaItems[2], { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, "+=0.3")
                .add(() => {
                    const icon = ctaItems[2].querySelector('.icon-wrap');
                    const txt = ctaItems[2].querySelector('.text');
                    gsap.to(icon, { x: 0, duration: 1.0, ease: "power2.inOut" });
                    gsap.to(txt.children, { opacity: 1, x: 0, duration: 0.45, stagger: 0.025, ease: "power2.out", delay: 0.35 });
                })
                .to("#slide-3 .phone-item .fill-overlay", {
                    width: "100%", duration: 1.0, ease: "power2.inOut"
                }, "+=0.6")
                .add(() => {
                    document.querySelector('#slide-3 .phone-item').classList.add('filled');
                    const phoneIcon = document.querySelector('#slide-3 .phone-item .icon-wrap');
                    gsap.fromTo(phoneIcon,
                        { rotation: 0 },
                        {
                            rotation: 18, duration: 0.09, repeat: 21,
                            yoyo: true, ease: "power2.inOut",
                            transformOrigin: "center center",
                            onComplete: () => { gsap.to(phoneIcon, { rotation: 0, duration: 0.15, ease: "power2.out" }); }
                        }
                    );
                })
                .to("#slide-3 .phone-item", {
                    boxShadow: "0 0 14px rgba(0, 229, 255, 0.28), inset 0 0 14px rgba(0, 229, 255, 0.06)",
                    duration: 0.7, ease: "power2.out"
                }, "-=0.35");

            /* ===== TRANSITION 3 → FINAL ===== */
            masterTl
                .to("#slide-3", { y: "-100%", duration: 0.9, ease: "power2.inOut" }, "+=1.0")
                .to("#final-slide", { y: "0%", duration: 0.9, ease: "power2.inOut" }, "<");

            /* ===== FINAL SLIDE ===== */
            masterTl
                .to("#final-slide .final-glow", {
                    opacity: 1, scale: 1, duration: 1.1, ease: "power2.out"
                }, "-=0.6")
                .to(finalLines, {
                    opacity: 1, x: 0, filter: "blur(0px)",
                    duration: 0.9, stagger: 0.07, ease: "power2.out"
                }, "-=0.8")
                .to("#final-slide .final-neon-line", {
                    opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.inOut"
                }, "-=0.5")
                .to("#final-slide .final-cta", {
                    opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.4)"
                }, "-=0.4")
                .to("#final-slide .final-cta .dm-icon", {
                    opacity: 1, x: 0, duration: 0.5, ease: "power2.out"
                }, "-=0.4")
                .to("#final-slide .final-cta .dm-text span", {
                    opacity: 1, x: 0, duration: 0.45,
                    stagger: 0.035, ease: "power2.out"
                }, "-=0.4")
                .to("#final-slide .final-cta", {
                    boxShadow: "0 0 35px rgba(0, 229, 255, 0.6), inset 0 0 30px rgba(0, 229, 255, 0.12)",
                    duration: 1.0, repeat: -1, yoyo: true, ease: "sine.inOut"
                });
        });
    </script>
</body>
</html>
